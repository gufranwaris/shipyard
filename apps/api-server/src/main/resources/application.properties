spring.application.name=JPA-Tutorial
server.port=${API_SERVER_PORT:8080}

#DB configuration
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/shipyard}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:shipyard}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:shipyard}

shipyard.rabbitmq.exchange=${RABBITMQ_EXCHANGE:deployments.exchange}
shipyard.rabbitmq.build-queue=${RABBITMQ_BUILD_QUEUE:deployments.build.queue}
shipyard.rabbitmq.build-routing-key=${RABBITMQ_BUILD_ROUTING_KEY:deployment.created}

