spring.application.name=api-server
server.port=${API_SERVER_PORT:8080}

#DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/shipyard
spring.datasource.username=shipyard
spring.datasource.password=shipyard

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:shipyard}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:shipyard}

shipyard.rabbitmq.exchange=deployments.build.exchange
shipyard.rabbitmq.build-queue=deployments.build.queue
shipyard.rabbitmq.build-routing-key=deployment.build.created

