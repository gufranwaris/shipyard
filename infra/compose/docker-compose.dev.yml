services:
  shipyard-redis:
    image: redis:7
    ports:
      - "6379:6379"
  shipyard-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: shipyard
      POSTGRES_DB: shipyard
    ports:
      - "5432:5432"
